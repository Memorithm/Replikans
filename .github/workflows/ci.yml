name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject hard-coded wallet material
        run: bash scripts/check-no-hardcoded-wallets.sh

      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Trading paper agent acceptance
        run: |
          cargo build -p replikan-trading --bin replikan-trading
          python3 scripts/trading-paper-demo.py target/debug/replikan-trading

      - name: MCP protocol and real paper runtime acceptance
        env:
          REPLIKAN_TRADING_BINARY: target/debug/replikan-trading
        run: python3 -m unittest discover -s scripts -p 'test_trading_mcp.py' -v

      - name: Local agent and source evidence acceptance
        env:
          REPLIKAN_TRADING_BINARY: target/debug/replikan-trading
        run: python3 -m unittest discover -s scripts -p 'test_trading_agent*.py' -v
