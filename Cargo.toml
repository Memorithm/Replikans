[workspace]
members = [
    "crates/replikan-core",
    "crates/replikan-economics",
    "crates/replikan-wallet",
    "crates/replikan-survival",
    "crates/replikan-replication",
    "crates/replikan-ledger",
    "crates/replikan-opportunities",
    "crates/replikan-mining",
    "crates/replikan-mining-market",
    "crates/replikan-market-feeds",
    "crates/replikan-market-http",
    "crates/replikan-mining-pipeline",
    "crates/replikan-network-feeds",
    "crates/replikan-bitcoin-pipeline",
    "crates/replikan-bitcoin-planner",
    "crates/replikan-resource",
    "crates/replikan-orchestrator",
    "crates/replikan-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Memorithm/Replikans"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
